<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Чаты</title>
    </head>
    <body>
        <h1>Чаты</h1>
        {% for chat in chats %}
            <a href="{{ url_for('chat_detail', chat_id=chat.id)}}"
               style="text-decoration: none; color: inherit; display: block;">
                <div>
                    ID #{{ chat.id }}. Status: {{ chat.status }}. <br>
                    Name: {{ chat.name }}. User_id: {{ chat.user_id }}
                </div>
            </a>
        {% endfor %}
    </body>
</html>
