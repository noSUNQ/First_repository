<!-- project/app/auth/templates/auth/index.html -->
<!DOCTYPE html>
<html lang="ru">
    <head>
        <link href="{{ url_for('auth.static', filename='css/styles.css') }}" rel="stylesheet" />
        <title>Вход</title>
    </head>
    <body>
        <div class="container">
            <div class="window_login">

                <h3>Войти в систему</h3>

                <div id="status"></div>

                <div id="divEmail" class="form-group">
                    <form id="formEmail">
                        <label>Почта:</label>
                        <input id="inputEmail" type="email" placeholder="Почта" autofocus required>
                        <button id="btnEmail" type="submit">↵</button>
                    </form>
                    <form id="formOtp" class="form-group" style="display: none;">
                        <input id="inputOtp"
                            name="otp"
                            type="text" 
                            inputmode="numeric"
                            pattern="\d{6}"
                            autocomplete="one-time-code"
                            maxlength="6"
                            size="6"
                            placeholder="6-ти значный код">
                        <button id="btnOtp" type="submit">↵</button>
                    </form>
                </div>

                <button id="btnLoginTg">Войти через Telegram</button>

            </div>
        </div>

        <script>
            const btnTg = document.getElementById('btnLoginTg')

            const status = document.getElementById('status')

            const formEmail = document.getElementById('formEmail');
            const formOtp = document.getElementById('formOtp');

            const inputEmail = document.getElementById('inputEmail');    
            const inputOtp = document.getElementById('inputOtp');

            /*const showStatus = (msg, color = 'black') => {
                status.innerHTML = `<strong style="color:${color}">${msg}</strong>`;
                setTimeout(() => status.innerHTML = '', 10000)
            };*/

            function showStatus(text, color) {
                const msg = document.createElement('div');
                msg.textContent = text;
                msg.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 15px;
                    background: ${color === 'green' ? '#d4edda' : '#f8d7da'};
                    color: ${color};
                    border-radius: 8px;
                    z-index: 11;
                    font-weight: bold;
                `;
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 3000);
            }

            document.getElementById('formEmail').addEventListener('submit', async (e) => {
                e.preventDefault();

                const valueEmail = inputEmail.value.trim();
                if (!valueEmail) return;

                try {
                    const res = await fetch('/auth/send_otp', {
                        method: 'POST',
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ valueEmail: valueEmail })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        showStatus(data.msg, data.color)
                        if (data.status === 'success') {
                            inputEmail.ReadOnly = true;
                            //formEmail.style.display = 'none';
                            formOtp.style.removeProperty('display');
                            inputOtp.focus();
                        } 
                    }
                } catch (err) {
                    console.error(err);
                }
            })


            document.getElementById('inputOtp').addEventListener('input', async (e) => {
                const valueOtp = e.target.value.replace(/\D/g, '');
                const valueEmail = inputEmail.value.trim();
                if (valueOtp.length === 6) {
                    try {
                        const res = await fetch('/auth/verify', {
                            method: 'POST',
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({ valueOtp: valueOtp, valueEmail:valueEmail })
                        });
                        const data = await res.json();
                        if (res.ok && data.status === 'success') {
                            window.location.href = '/';
                        } else return showStatus(data.msg, data.color)
                    } catch (err) {
                        console.error(err);
                    }
                } else showStatus('Введите 6 цифр', 'green' )
            });

        </script>
    </body>
    
</html>
